[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "physics-surrogate-env"
version = "1.0.0"
description = "An OpenEnv environment for physics surrogate modeling using The Well dataset"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Samnit Mehandiratta", email = "m25ai2087@iitj.ac.in"}
]
keywords = ["physics", "surrogate", "openenv", "machine-learning", "the-well"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "gradio>=6.11.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "h5py>=3.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/samnitmehandiratta/my-env"
Repository = "https://github.com/samnitmehandiratta/my-openenv"

[tool.setuptools.packages.find]
include = ["*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
