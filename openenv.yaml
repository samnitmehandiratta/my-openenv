name: sre_incident_triage
version: 1.0.0
description: >
  A real-world SRE (Site Reliability Engineer) incident triage environment.
  An AI agent receives production alerts, logs, and metrics, then must investigate,
  diagnose the root cause, and recommend the correct remediation action.
  Models tasks that on-call engineers perform daily at scale.
tags:
  - sre
  - devops
  - incident-response
  - observability
  - openenv
author: Samnit Mehandiratta
license: MIT

observation:
  type: object
  properties:
    alerts:
      type: array
      items:
        type: string
      description: Active production alerts with severity and message
    logs:
      type: array
      items:
        type: string
      description: Recent log lines from affected services
    metrics:
      type: object
      description: Per-service metrics (cpu, memory, error_rate, latency, etc.)
    task_description:
      type: string
      description: Description of the incident to triage
    step:
      type: integer
      description: Current step number in the episode
    additional_info:
      type: object
      description: Extra investigation data returned after an investigate action

action:
  type: object
  properties:
    action_type:
      type: string
      enum:
        - investigate
        - diagnose
        - resolve
        - done
      description: Type of action to take
    service:
      type: string
      description: Service name to investigate (for investigate action)
    severity:
      type: string
      enum:
        - critical
        - high
        - medium
        - low
      description: Assessed incident severity
    root_cause:
      type: string
      description: Free-text description of the identified root cause
    affected_services:
      type: array
      items:
        type: string
      description: List of affected service names
    recommended_action:
      type: string
      description: Specific remediation step to resolve the incident

reward:
  type: object
  properties:
    score:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: Overall score for this step (0.01 to 0.99)
    severity_correct:
      type: boolean
      description: Whether the severity classification was correct
    root_cause_score:
      type: number
      description: Score for root cause identification accuracy
    action_score:
      type: number
      description: Score for recommended action quality
    feedback:
      type: string
      description: Human-readable feedback on the action taken

tasks:
  - id: cpu_spike
    name: CPU Spike Investigation
    difficulty: easy
    description: >
      An api-server is throwing high CPU alerts with elevated response times.
      The root cause is a traffic spike with no rate limiting configured.
      Agent should identify the traffic overload and recommend scaling or rate limiting.

  - id: cascading_failure
    name: Cascading Service Failure
    difficulty: medium
    description: >
      Multiple services are failing in a cascade pattern. A recent deployment of
      payment-service v2.3.1 introduced a misconfigured DB connection pool (500 vs 10),
      exhausting the database. Agent must trace the cascade back to the root service
      and recommend a rollback.

  - id: memory_leak
    name: Memory Leak Detection
    difficulty: hard
    description: >
      Multiple unrelated services are experiencing intermittent OOM kills over 2 hours.
      The root cause is a shared logging-middleware v2.1.0 deployed 2 hours ago that
      introduced an async buffer which never flushes, causing gradual memory accumulation.
      Agent must investigate across services, find the shared component, and recommend rollback.
