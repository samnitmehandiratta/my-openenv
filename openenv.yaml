name: physics_surrogate
version: 1.0.0
description: An environment for physics surrogate modeling using The Well dataset. Agents learn to predict future states of physical systems from initial conditions.
tags:
  - physics
  - simulation
  - surrogate
  - machine-learning
  - the-well
author: Samnit Mehandiratta
license: MIT

observation:
  type: object
  properties:
    initial_state:
      type: array
      description: Initial scalar field state (2D or 3D grid)
    metadata:
      type: object
      properties:
        dataset:
          type: string
        resolution:
          type: array
          items:
            type: integer
        field_type:
          type: string
        time_step:
          type: integer
    task_description:
      type: string
      description: Description of the prediction task
    hints:
      type: array
      items:
        type: string

action:
  type: object
  properties:
    predicted_field:
      type: array
      description: Predicted future state field
    num_steps:
      type: integer
      description: Number of timesteps to predict
    done:
      type: boolean
      description: Whether to finish the episode

reward:
  type: object
  properties:
    score:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: Overall score for prediction accuracy
    mse:
      type: number
      description: Mean squared error between prediction and ground truth
    correlation:
      type: number
      description: Pearson correlation coefficient
    error:
      type: string
      description: Error message if any

tasks:
  - id: fluid_short_prediction
    name: Short-term Fluid Prediction
    difficulty: easy
    description: Predict 5 timesteps ahead for fluid dynamics simulation
  - id: fluid_medium_prediction
    name: Medium-term Fluid Prediction
    difficulty: medium
    description: Predict 20 timesteps ahead for fluid dynamics simulation
  - id: turbulence_prediction
    name: Turbulence Long-range Prediction
    difficulty: hard
    description: Predict 50 timesteps ahead for turbulent flow with high accuracy
